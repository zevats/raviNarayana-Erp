<title>Ravinarayan</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 16px calc(32px + env(safe-area-inset-bottom));
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #16241B;
    background: radial-gradient(120% 70% at 50% 0%, #E3EBDD 0%, #F4F1EA 55%, #F1ECE2 100%);
  }
  .brand { text-align: center; margin-bottom: 28px; }
  .brand img { width: 92px; height: 92px; display: block; margin: 0 auto 14px; }
  .brand p { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.03em; color: #1A2E20; }
  .brand p span { color: #B58A57; }
  main {
    width: 100%; max-width: 420px; background: rgba(255,255,255,.86); border: 1px solid rgba(255,255,255,.9);
    border-radius: 28px; padding: 28px 22px 24px; text-align: center;
    box-shadow: 0 18px 50px -24px rgba(15,42,29,.35);
  }
  h1 { margin: 0 0 22px; font-size: 21px; font-weight: 700; }
  button {
    width: 100%; height: 50px; border: 0; border-radius: 999px; background: #1E3A2B; color: #fff;
    font-size: 15px; font-weight: 700; transition: transform .12s ease, opacity .2s ease;
  }
  button:active { transform: scale(.98); }
  button[disabled] { opacity: .7; }
</style>

<main>
  <h1>No connection</h1>
  <button id="retry" type="button">Try again</button>
</main>
<script>
  var HOME = "https://ravinarayan-erp-demo.onrender.com";
  var btn = document.getElementById("retry");
  // Opens the ERP as soon as the server answers (also covers a server that is still waking up).
  function check(manual) {
    if (manual) { btn.disabled = true; btn.textContent = "Connecting…"; }
    fetch(HOME + "/login", { mode: "no-cors", cache: "no-store" })
      .then(function () { location.replace(HOME); })
      .catch(function () { if (manual) { btn.disabled = false; btn.textContent = "Try again"; } });
  }
  btn.addEventListener("click", function () { check(true); });
  window.addEventListener("online", function () { check(false); });
  setInterval(function () { if (navigator.onLine !== false) check(false); }, 6000);
  try { window.Capacitor && window.Capacitor.Plugins.SplashScreen && window.Capacitor.Plugins.SplashScreen.hide({ fadeOutDuration: 250 }); } catch (e) {}
  try { window.RnApp && window.RnApp.ready && window.RnApp.ready(); } catch (e) {}
  try { window.Capacitor && window.Capacitor.Plugins.RnApp && window.Capacitor.Plugins.RnApp.ready(); } catch (e) {}
</script>
